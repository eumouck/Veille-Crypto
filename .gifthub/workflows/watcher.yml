name: watcher-crypto

on:
  schedule:
    - cron: '*/15 * * * *'   # toutes les 15 minutes (UTC)
  workflow_dispatch:          # permet de lancer a la main depuis l'onglet Actions

permissions:
  contents: write             # pour sauvegarder state.json entre les executions

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Lancer le surveillant
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py

      - name: Sauvegarder l'etat
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "watcher-bot"
            git config user.email "watcher@users.noreply.github.com"
            git add state.json
            git commit -m "update state [skip ci]"
            git push
          else
            echo "state inchange"
          fi
